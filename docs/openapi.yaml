  /api/billing-periods/:
    get:
      operationId: billing_periods_list
      parameters:
      - in: query
        name: frequency
        schema:
          type: string
          enum:
          - BIMONTHLY
          - CUSTOM
          - MONTHLY
          - QUARTERLY
        description: |-
          * `MONTHLY` - Monthly
          * `BIMONTHLY` - Bi-monthly
          * `QUARTERLY` - Quarterly
          * `CUSTOM` - Custom
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CLOSED
          - GENERATED
          - OPEN
        description: |-
          * `OPEN` - Open (readings being collected)
          * `GENERATED` - Bills generated
          * `CLOSED` - Closed
      tags:
      - billing-periods
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBillingPeriodList'
          description: ''
    post:
      operationId: billing_periods_create
      tags:
      - billing-periods
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingPeriod'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BillingPeriod'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BillingPeriod'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPeriod'
          description: ''
  /api/billing-periods/{id}/:
    get:
      operationId: billing_periods_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this billing period.
        required: true
      tags:
      - billing-periods
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPeriod'
          description: ''
    put:
      operationId: billing_periods_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this billing period.
        required: true
      tags:
      - billing-periods
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingPeriod'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BillingPeriod'
          multipart/form-data:
