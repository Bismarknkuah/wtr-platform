openapi: 3.0.3
info:
  title: WTR Ghana Water Platform API
  version: 1.0.0
  description: Multi-tenant community water utility management API.
paths:
  /api/analytics/benchmark/:
    get:
      operationId: analytics_benchmark_retrieve
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/intelligence/:
    post:
      operationId: analytics_intelligence_create
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/revenue/:
    get:
      operationId: analytics_revenue_retrieve
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/score/:
    get:
      operationId: analytics_score_retrieve
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/approvals/:
    get:
      operationId: approvals_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: request_type
        schema:
          type: string
          enum:
          - BILL_ADJUSTMENT
          - CUSTOMER_DEACTIVATION
          - DEBT_WRITE_OFF
          - DISCONNECTION
          - METER_REPLACEMENT
          - PAYMENT_CORRECTION
          - RECONNECTION
          - REFUND
          - TARIFF_CHANGE
        description: |-
          * `BILL_ADJUSTMENT` - Bill adjustment
          * `REFUND` - Refund
          * `TARIFF_CHANGE` - Customer tariff change
          * `METER_REPLACEMENT` - Meter replacement
          * `CUSTOMER_DEACTIVATION` - Customer deactivation
          * `DEBT_WRITE_OFF` - Debt write-off
          * `DISCONNECTION` - Disconnection
          * `RECONNECTION` - Reconnection
          * `PAYMENT_CORRECTION` - Manual payment correction (reversal)
      - in: query
        name: requested_by
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPROVED
          - EXECUTED
          - FAILED
          - PENDING
          - REJECTED
        description: |-
          * `PENDING` - Pending
          * `APPROVED` - Approved
          * `REJECTED` - Rejected
          * `EXECUTED` - Executed
          * `FAILED` - Execution failed
      tags:
      - approvals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalRequestList'
          description: ''
    post:
      operationId: approvals_create
      tags:
      - approvals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
          description: ''
  /api/approvals/{id}/:
    get:
      operationId: approvals_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this approval request.
        required: true
      tags:
      - approvals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
          description: ''
    delete:
      operationId: approvals_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this approval request.
        required: true
      tags:
      - approvals
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/approvals/{id}/approve/:
    post:
      operationId: approvals_approve_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this approval request.
        required: true
      tags:
      - approvals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
          description: ''
  /api/approvals/{id}/reject/:
    post:
      operationId: approvals_reject_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this approval request.
        required: true
      tags:
      - approvals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
          description: ''
  /api/assets/:
    get:
      operationId: assets_list
      parameters:
      - in: query
        name: asset_type
        schema:
          type: string
          enum:
          - BOREHOLE
          - CHLORINATION
          - CONTROL_PANEL
          - FILTER
          - GENERATOR
          - OTHER
          - PIPELINE
          - PUMP
          - RESERVOIR
          - SOLAR
          - TANK
          - TREATMENT_PLANT
          - VALVE
          - WELL
        description: |-
          * `BOREHOLE` - Borehole
          * `WELL` - Well
          * `TREATMENT_PLANT` - Treatment plant
          * `RESERVOIR` - Reservoir
          * `TANK` - Tank
          * `PIPELINE` - Pipeline
          * `PUMP` - Pump
          * `GENERATOR` - Generator
          * `SOLAR` - Solar system
          * `CONTROL_PANEL` - Control panel
          * `VALVE` - Valve
          * `FILTER` - Filter
          * `CHLORINATION` - Chlorination equipment
          * `OTHER` - Other
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - DECOMMISSIONED
          - DEGRADED
          - FAILED
          - OPERATIONAL
          - UNDER_MAINTENANCE
        description: |-
          * `OPERATIONAL` - Operational
          * `DEGRADED` - Degraded
          * `UNDER_MAINTENANCE` - Under maintenance
          * `FAILED` - Failed
          * `DECOMMISSIONED` - Decommissioned
      tags:
      - assets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssetList'
          description: ''
    post:
      operationId: assets_create
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Asset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Asset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Asset'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
  /api/assets/{id}/:
    get:
      operationId: assets_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this asset.
        required: true
      tags:
      - assets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
    put:
      operationId: assets_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this asset.
        required: true
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Asset'
          application/x-www-form-urlencoded:
            schema:
